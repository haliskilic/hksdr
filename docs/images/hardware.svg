<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <rect width="860" height="220" rx="14" fill="#0b1020"/>
  <style>
    .box{fill:#111827;stroke:#334155;stroke-width:1.5;rx:10}
    .t{fill:#e5e7eb;font-weight:700;font-size:15px}
    .s{fill:#9ca3af;font-size:11.5px}
    .lbl{fill:#64748b;font-size:11px;font-weight:600}
    .arr{stroke:#38bdf8;stroke-width:2.5;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Antenna -->
  <g transform="translate(28,60)">
    <rect class="box" width="150" height="100" rx="10"/>
    <text x="75" y="34" text-anchor="middle" font-size="30">📡</text>
    <text class="t" x="75" y="64" text-anchor="middle">Antenna</text>
    <text class="s" x="75" y="84" text-anchor="middle">VHF/UHF ¼λ · dipole</text>
  </g>
  <text class="lbl" x="190" y="105" text-anchor="middle">RF</text>
  <line class="arr" x1="178" y1="110" x2="222" y2="110"/>

  <!-- RTL-SDR -->
  <g transform="translate(228,60)">
    <rect class="box" width="170" height="100" rx="10"/>
    <text x="85" y="34" text-anchor="middle" font-size="28">🛰️</text>
    <text class="t" x="85" y="64" text-anchor="middle">RTL-SDR 820T2</text>
    <text class="s" x="85" y="84" text-anchor="middle">RTL2832U + R820T2</text>
  </g>
  <text class="lbl" x="418" y="105" text-anchor="middle">USB</text>
  <line class="arr" x1="398" y1="110" x2="442" y2="110"/>

  <!-- PC / backend -->
  <g transform="translate(448,60)">
    <rect class="box" width="180" height="100" rx="10"/>
    <text x="90" y="34" text-anchor="middle" font-size="28">💻</text>
    <text class="t" x="90" y="64" text-anchor="middle">Linux PC</text>
    <text class="s" x="90" y="84" text-anchor="middle">Python backend + decoders</text>
  </g>
  <text class="lbl" x="648" y="105" text-anchor="middle">HTTP</text>
  <line class="arr" x1="628" y1="110" x2="672" y2="110"/>

  <!-- Browser -->
  <g transform="translate(678,60)">
    <rect class="box" width="154" height="100" rx="10"/>
    <text x="77" y="34" text-anchor="middle" font-size="28">🌐</text>
    <text class="t" x="77" y="64" text-anchor="middle">Web UI</text>
    <text class="s" x="77" y="84" text-anchor="middle">browser · phone (PWA)</text>
  </g>

  <text class="lbl" x="430" y="30" text-anchor="middle" font-size="13" fill="#94a3b8">HK.SDR — signal chain / sinyal zinciri</text>
  <text class="s" x="430" y="198" text-anchor="middle">RX-only · 24–1766 MHz · single USB device, one task at a time</text>
</svg>
